name: Kontrola strony digitalpower.art
on:
  schedule:
    - cron: '17 6 * * 1'   # co poniedziałek ok. 7:17 / 8:17 czasu w Dortmundzie
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node .github/kontrola/test.js
